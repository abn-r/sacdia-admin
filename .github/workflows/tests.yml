name: Tests

on:
  pull_request:
    branches:
      - main
      - preproduction
      - development

jobs:
  vitest:
    name: Vitest unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # screen-catalog.app.test.ts compares the admin catalog with the Flutter fixture.
      - name: Checkout sacdia-app (screen catalog fixture)
        uses: actions/checkout@v4
        with:
          repository: abn-r/sacdia-app
          ref: ${{ github.base_ref }}
          path: .ci/sacdia-app
          sparse-checkout: test/fixtures

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          SACDIA_APP_DIR: .ci/sacdia-app
